name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Unit + mock-agent + mock-OAuth tests
        run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: vscode-acp-plugin.vsix
          path: dist/vscode-acp-plugin.vsix

  integration:
    # Real VS Code (downloaded by @vscode/test-electron) under xvfb.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: xvfb-run -a npm run test:integration

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Check the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm run package
      - name: Name the artifact after the version
        run: cp dist/vscode-acp-plugin.vsix "dist/vscode-acp-plugin-${GITHUB_REF_NAME#v}.vsix"
      - name: Create the GitHub Release with the .vsix attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/vscode-acp-plugin-${GITHUB_REF_NAME#v}.vsix" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
